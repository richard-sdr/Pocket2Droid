name: Build Pocket2Droid APK (Debug)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'qemu-*/**/*.c'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    # ================================================================
    # Step 1: Checkout
    # ================================================================
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ================================================================
    # Step 2: JDK 17
    # ================================================================
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # ================================================================
    # Step 3: Android cmdline-tools + default packages
    #
    # setup-android@v3 only accepts 4 inputs:
    #   cmdline-tools-version, accept-android-sdk-licenses,
    #   log-accepted-android-sdk-licenses, packages
    # It does NOT accept api-level / ndk-version / build-tools.
    # We install cmdline-tools here, then call sdkmanager manually
    # for platforms/build-tools/NDK.
    # ================================================================
    - name: Setup Android cmdline-tools
      uses: android-actions/setup-android@v3
      with:
        # Default is 'tools platform-tools'. Newer cmdline-tools
        # may have retired the 'tools' package name — skip it,
        # we will install everything explicitly via sdkmanager.
        packages: 'platform-tools'

    # ================================================================
    # Step 4: Install platforms / build-tools / NDK via sdkmanager
    # ================================================================
    - name: Install Android packages
      run: |
        set -euo pipefail
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls "$ANDROID_HOME/cmdline-tools/latest/bin/"

        yes | sdkmanager --licenses > /dev/null || true

        # List what's available (debug)
        sdkmanager --list 2>/dev/null | grep -E "ndk;30|platforms;android-36|build-tools" | head -20 || true

        # Install exactly what we need
        sdkmanager \
          "platforms;android-36" \
          "build-tools;34.0.0" \
          "ndk;30.2.6722718"

        echo ""
        echo "=== Verification ==="
        ls "$ANDROID_HOME/platforms/android-36/android.jar"
        ls "$ANDROID_HOME/build-tools/34.0.0/zipalign"
        ls "$ANDROID_HOME/build-tools/34.0.0/apksigner"
        NDK_DIR="$ANDROID_HOME/ndk/30.2.6722718"
        ls "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

        echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
        echo "PATH=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> "$GITHUB_PATH"

    # ================================================================
    # Step 5: Install host build tools
    # ================================================================
    - name: Install host build tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y pkg-config file curl wget ninja-build python3-pip
        pip install --break-system-packages meson pyelftools

    # ================================================================
    # Step 6: Prepare Termux Bionic sysroot
    #
    # Termux maintains Android-Bionic-native packages at packages.termux.dev.
    # We download .deb files directly and extract into a sysroot.
    # This is the original author's approach recreated for GHA.
    # ================================================================
    - name: Prepare Termux Bionic sysroot
      id: deps
      run: |
        set -euo pipefail
        SYSROOT="${GITHUB_WORKSPACE}/deps/sysroot"
        mkdir -p "$SYSROOT"
        echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV

        TERMUX_POOL="https://packages.termux.dev/apt/termux-main/pool/main"

        echo "=== Fetching Termux package index ==="
        curl -sL "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz" \
          | gunzip > /tmp/termux-Packages.txt

        resolve_pkg() {
          local name="$1"
          grep -A 2 "^Package: ${name}$" /tmp/termux-Packages.txt \
            | grep "^Filename:" | head -1 | sed 's/^Filename: //'
        }

        PACKAGES=(glib pixman libslirp libxml2 libiconv libffi liblz4)
        for pkg in "${PACKAGES[@]}"; do
          FILE=$(resolve_pkg "$pkg")
          if [ -z "$FILE" ]; then
            echo "WARN: $pkg not found in Termux index — skipping"
            continue
          fi
          URL="$TERMUX_POOL/$FILE"
          DEB="/tmp/$(basename "$FILE")"
          echo "Fetching $pkg → $DEB"
          curl -sL -o "$DEB" "$URL"
          dpkg-deb -x "$DEB" "$SYSROOT"
        done

        echo ""
        echo "=== Verify sysroot contents ==="
        find "$SYSROOT" -name "glib.h" 2>/dev/null | head -3
        find "$SYSROOT" -name "pixman.h" 2>/dev/null | head -3
        find "$SYSROOT" -name "libslirp*" 2>/dev/null | head -3

    # ================================================================
    # Step 7: Build QEMU → libp2dengine.so
    # ================================================================
    - name: Build QEMU native engine
      id: qemu
      run: |
        set -euo pipefail
        NDK="${{ env.NDK_HOME }}"
        SYSROOT="${{ env.SYSROOT }}"

        CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
        CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

        cd "${GITHUB_WORKSPACE}/qemu-android-exact"

        PREFIX="$SYSROOT/data/data/com.termux/files/usr"
        if [ ! -d "$PREFIX" ]; then
          PREFIX="$SYSROOT"
        fi
        echo "Using prefix: $PREFIX"
        ls "$PREFIX/include/glib-2.0/glib.h"
        ls "$PREFIX/include/pixman-1/pixman.h"

        rm -rf build-android

        ./configure \
          --target-list=arm-softmmu \
          --with-devices-arm=p2d \
          --cc="$CC" --cxx="$CXX" \
          --host-cc=gcc --cross-prefix="llvm-" \
          --cpu=aarch64 \
          --disable-werror \
          --without-default-features \
          --without-default-devices \
          --enable-tcg \
          --enable-pixman \
          --enable-slirp \
          --disable-tools \
          --disable-docs \
          --disable-user \
          --disable-plugins \
          --disable-modules \
          --extra-cflags="-I${PREFIX}/include -I${PREFIX}/include/pixman-1 -I${PREFIX}/include/glib-2.0 -I${PREFIX}/lib/glib-2.0/include" \
          --extra-ldflags="-L${PREFIX}/lib -Wl,-z,max-page-size=16384 -Wl,-rpath,\$ORIGIN" \
          --prefix="/data/local/tmp" \
          build-android 2>&1 | tee "${GITHUB_WORKSPACE}/android/build/configure.log"

        echo "=== configure OK, starting ninja ==="
        cd build-android
        ninja -j$(nproc) qemu-system-arm 2>&1 | tee "${GITHUB_WORKSPACE}/android/build/ninja.log"

        mkdir -p "${GITHUB_WORKSPACE}/android/build"
        cp qemu-system-arm "${GITHUB_WORKSPACE}/android/build/libp2dengine.so"
        file "${GITHUB_WORKSPACE}/android/build/libp2dengine.so"
        echo "✓ QEMU engine built"

    # ================================================================
    # Step 8: Build APK (Java + DEX + align + debug-sign)
    # ================================================================
    - name: Build APK
      run: python3 android/build_apk_gha.py

    # ================================================================
    # Step 9: Upload artifact
    # ================================================================
    - uses: actions/upload-artifact@v4
      with:
        name: Pocket2Droid-debug-${{ github.sha }}
        path: android/build/Pocket2Droid-DEBUG.apk
        if-no-files-found: error
        retention-days: 30
