name: Build Pocket2Droid APK (Debug)

# Manual trigger only. Push-trigger would cost 30-45 min per accidental commit.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'qemu-*/**/*.c'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # GitHub-hosted runners have 2-core, 7GB RAM. QEMU -j$(nproc) will use 2.
    # If this is too slow, consider self-hosted with more cores.

    steps:
    # ================================================================
    # Step 1: Checkout
    # ================================================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ================================================================
    # Step 2: JDK 17 + Android SDK 36 + NDK r30
    # ================================================================
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK + NDK
      id: android
      uses: android-actions/setup-android@v3
      with:
        api-level: 36
        cmdline-tools: tools;platform-tools;build-tools
        ndk-version: 30.2.6722718

    # ================================================================
    # Step 3: Install build tools
    # ================================================================
    - name: Install build tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y pkg-config file curl wget ninja-build python3-pip
        pip install --break-system-packages meson pyelftools

    # ================================================================
    # Step 4: Export paths + verify toolchain
    # ================================================================
    - name: Export environment
      run: |
        echo "ANDROID_HOME=${{ steps.android.outputs.ANDROID_HOME }}" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=${{ steps.android.outputs.ANDROID_NDK_HOME }}" >> $GITHUB_ENV

        NDK="${{ steps.android.outputs.ANDROID_NDK_HOME }}"
        echo "PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_PATH

        TOOLS="${{ steps.android.outputs.ANDROID_HOME }}/build-tools"
        LATEST_TOOLS=$(ls "$TOOLS" | sort -V | tail -1)
        echo "BUILD_TOOLS=$TOOLS/$LATEST_TOOLS" >> $GITHUB_ENV

        echo "=== Toolchain ==="
        which aarch64-linux-android24-clang && aarch64-linux-android24-clang --version | head -1
        ls "${{ steps.android.outputs.ANDROID_HOME }}/cmdline-tools/latest/lib/d8.jar"
        echo "OK"

    # ================================================================
    # Step 5: Termux Bionic deps (glib, pixman, libslirp, ...)
    #
    # Termux maintains Android-Bionic-native packages at packages.termux.dev.
    # We download .deb files directly and extract into a sysroot.
    # This is the original author's approach recreated for GHA.
    #
    # If this fails (Termux repo change), switch to the source-build
    # alternative below (commented out).
    # ================================================================
    - name: Prepare Termux Bionic sysroot
      id: deps
      run: |
        set -euo pipefail
        SYSROOT="${GITHUB_WORKSPACE}/deps/sysroot"
        mkdir -p "$SYSROOT"
        echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV

        # --- Find latest Termux package versions via Packages.gz index ---
        TERMUX_POOL="https://packages.termux.dev/apt/termux-main/pool/main"
        TERMUX_PKGS="https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz"

        echo "=== Fetching Termux package index ==="
        curl -sL "$TERMUX_PKGS" | gunzip > /tmp/termux-Packages.txt

        resolve_pkg() {
          local name="$1"
          grep -A 2 "^Package: ${name}$" /tmp/termux-Packages.txt \
            | grep "^Filename:" | head -1 | sed 's/^Filename: //'
        }

        PACKAGES=(glib pixman libslirp libxml2 libiconv libffi liblz4)
        for pkg in "${PACKAGES[@]}"; do
          FILE=$(resolve_pkg "$pkg")
          if [ -z "$FILE" ]; then
            echo "WARN: $pkg not found in Termux index — skipping"
            continue
          fi
          URL="$TERMUX_POOL/$FILE"
          DEB="/tmp/$(basename "$FILE")"
          echo "Fetching $pkg → $DEB"
          curl -sL -o "$DEB" "$URL"
          dpkg-deb -x "$DEB" "$SYSROOT"
        done

        echo ""
        echo "=== Verify sysroot contents ==="
        find "$SYSROOT" -name "*.h" -path "*/include/*" | head -10
        find "$SYSROOT" -name "libglib*" -o -name "libpixman*" | head -10

    # ========= ALTERNATIVE (fallback if Termux path breaks) =========
    # Uncomment and use instead of Step 5 above if glib.h/pixman.h are missing.
    # This builds glib + pixman from source using NDK's Bionic directly.
    # Expect 20-30 min extra build time.
    #
    # - name: Prepare deps from source (fallback)
    #   id: deps
    #   run: |
    #     set -euo pipefail
    #     NDK="${{ steps.android.outputs.ANDROID_NDK_HOME }}"
    #     SYSROOT="${GITHUB_WORKSPACE}/deps/sysroot"
    #     mkdir -p "$SYSROOT" "$SYSROOT/bin"
    #     echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV
    #
    #     CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
    #     export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
    #
    #     # Build order: gettext → libffi → glib → pixman → libslirp
    #     # Each step: download, extract, configure/meson, make/ninja, install to $SYSROOT
    #     #
    #     # gettext:   https://ftp.gnu.org/gnu/gettext/gettext-0.22.tar.gz
    #     # libffi:    https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
    #     # glib:      https://download.gnome.org/sources/glib/2.80/glib-2.80.0.tar.gz
    #     # pixman:    https://gitlab.freedesktop.org/pixman/pixman/-/archive/0.42.2/pixman-0.42.2.tar.gz
    #     # libslirp:  https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.5/libslirp-v4.9.5.tar.gz
    #
    #     echo "Source-build fallback — see build script at android/build_deps_android.sh"

    # ================================================================
    # Step 6: Build QEMU → libp2dengine.so
    # ================================================================
    - name: Build QEMU native engine
      id: qemu
      run: |
        set -euo pipefail
        NDK="${{ steps.android.outputs.ANDROID_NDK_HOME }}"
        SYSROOT="${{ env.SYSROOT }}"

        CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
        CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

        export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

        cd "${GITHUB_WORKSPACE}/qemu-android-exact"

        # The Termux .deb extracts to data/data/com.termux/files/usr
        PREFIX="$SYSROOT/data/data/com.termux/files/usr"
        if [ ! -d "$PREFIX" ]; then
          # Alternative layout if we used source-build fallback
          PREFIX="$SYSROOT"
        fi
        echo "Using prefix: $PREFIX"
        ls "$PREFIX/include/glib-2.0/glib.h"
        ls "$PREFIX/include/pixman-1/pixman.h"

        rm -rf build-android

        ./configure \
          --target-list=arm-softmmu \
          --with-devices-arm=p2d \
          --cc="$CC" --cxx="$CXX" \
          --host-cc=gcc --cross-prefix="llvm-" \
          --cpu=aarch64 \
          --disable-werror \
          --without-default-features \
          --without-default-devices \
          --enable-tcg \
          --enable-pixman \
          --enable-slirp \
          --disable-tools \
          --disable-docs \
          --disable-user \
          --disable-plugins \
          --disable-modules \
          --extra-cflags="-I${PREFIX}/include -I${PREFIX}/include/pixman-1 -I${PREFIX}/include/glib-2.0 -I${PREFIX}/lib/glib-2.0/include" \
          --extra-ldflags="-L${PREFIX}/lib -Wl,-z,max-page-size=16384 -Wl,-rpath,\$ORIGIN" \
          --prefix="/data/local/tmp" \
          build-android 2>&1 | tee "${GITHUB_WORKSPACE}/android/build/configure.log"

        echo "=== configure succeeded, starting ninja ==="
        cd build-android
        ninja -j$(nproc) qemu-system-arm 2>&1 | tee "${GITHUB_WORKSPACE}/android/build/ninja.log"

        mkdir -p "${GITHUB_WORKSPACE}/android/build"
        cp qemu-system-arm "${GITHUB_WORKSPACE}/android/build/libp2dengine.so"
        file "${GITHUB_WORKSPACE}/android/build/libp2dengine.so"

        echo "QEMU engine built successfully"

    # ================================================================
    # Step 7: Build APK (Java + DEX + align + debug-sign)
    # ================================================================
    - name: Build APK
      run: python3 android/build_apk_gha.py

    # ================================================================
    # Step 8: Upload artifact
    # ================================================================
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pocket2Droid-debug-${{ github.sha }}
        path: android/build/Pocket2Droid-DEBUG.apk
        if-no-files-found: error
        retention-days: 30
