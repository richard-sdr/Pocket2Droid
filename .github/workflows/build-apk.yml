name: Build Pocket2Droid APK (Debug)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'qemu-*/**/*.c'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    # ================================================================
    # Step 1: Checkout
    # ================================================================
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ================================================================
    # Step 2: JDK 17
    # ================================================================
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # ================================================================
    # Step 3: Android cmdline-tools + default packages
    #
    # setup-android@v3 only accepts 4 inputs:
    #   cmdline-tools-version, accept-android-sdk-licenses,
    #   log-accepted-android-sdk-licenses, packages
    # It does NOT accept api-level / ndk-version / build-tools.
    # We install cmdline-tools here, then call sdkmanager manually
    # for platforms/build-tools/NDK.
    # ================================================================
    - name: Setup Android cmdline-tools
      uses: android-actions/setup-android@v3
      with:
        # Default is 'tools platform-tools'. Newer cmdline-tools
        # may have retired the 'tools' package name — skip it,
        # we will install everything explicitly via sdkmanager.
        packages: 'platform-tools'

    # ================================================================
    # Step 4: Install platforms / build-tools / NDK via sdkmanager
    # ================================================================
    - name: Install Android packages
      run: |
        set -euo pipefail
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls "$ANDROID_HOME/cmdline-tools/latest/bin/"

        yes | sdkmanager --licenses > /dev/null || true

        # List what's available (debug)
        sdkmanager --list 2>/dev/null | grep -E "ndk;30|platforms;android-36|build-tools" | head -20 || true

        # Install exactly what we need
        sdkmanager \
          "platforms;android-36" \
          "build-tools;34.0.0" \
          "ndk;30.0.16248370"

        echo ""
        echo "=== Verification ==="
        ls "$ANDROID_HOME/platforms/android-36/android.jar"
        ls "$ANDROID_HOME/build-tools/34.0.0/zipalign"
        ls "$ANDROID_HOME/build-tools/34.0.0/apksigner"
        NDK_DIR="$ANDROID_HOME/ndk/30.0.16248370"
        ls "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

        echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
        echo "PATH=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> "$GITHUB_PATH"

    # ================================================================
    # Step 5: Install host build tools
    # ================================================================
    - name: Install host build tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y pkg-config file curl wget ninja-build python3-pip patchelf
        pip install --break-system-packages meson pyelftools

    # ================================================================
    # Step 6: Prepare Termux Bionic sysroot
    #
    # Termux maintains Android-Bionic-native packages at packages.termux.dev.
    # We download .deb files directly and extract into a sysroot.
    # This is the original author's approach recreated for GHA.
    # ================================================================
    - name: Prepare Termux Bionic sysroot
      id: deps
      run: |
        set -euo pipefail
        SYSROOT="${GITHUB_WORKSPACE}/deps/sysroot"
        mkdir -p "$SYSROOT"
        echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV

        TERMUX_POOL="https://packages.termux.dev/apt/termux-main"

        echo "=== Fetching Termux package index ==="
        for i in 1 2 3; do
          if wget -q --timeout=30 -O /tmp/termux-Packages.gz \
              "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz"; then
            break
          fi
          echo "  wget attempt $i failed, retrying..."
          sleep 2
        done
        gunzip -c /tmp/termux-Packages.gz > /tmp/termux-Packages.txt
        echo "Index downloaded: $(wc -l < /tmp/termux-Packages.txt) lines"

        # Use a subshell WITHOUT pipefail for the extraction loop so that
        # grep non-match (exit 1) or a single failed download does NOT abort
        # the whole step. We only fail at the very end if we got nothing.
        set +eo pipefail

        PACKAGES=(glib libpixman libslirp libxml2 libiconv libffi liblz4 pcre2 zlib)
        extracted=0
        for pkg in "${PACKAGES[@]}"; do
          echo "--- $pkg ---"
          # grep -A 2 "^Package: $pkg$" exits 1 when no match → suppress
          section=$(awk "/^Package: ${pkg}$/,/^$/" /tmp/termux-Packages.txt)
          if [ -z "$section" ]; then
            echo "WARN: $pkg not found in Termux index — skipping"
            continue
          fi
          FILE=$(echo "$section" | grep "^Filename:" | head -1 | sed 's/^Filename: //')
          if [ -z "$FILE" ]; then
            echo "WARN: $pkg has no Filename in index — skipping"
            continue
          fi
          URL="$TERMUX_POOL/$FILE"
          DEB="/tmp/$(basename "$FILE")"
          echo "Downloading $pkg → $URL"
          if wget --timeout=30 -O "$DEB" "$URL" 2>&1; then
            dpkg-deb -x "$DEB" "$SYSROOT"
            echo "  ✓ extracted $pkg"
            extracted=$((extracted + 1))
          else
            echo "  ✗ download failed for $pkg"
          fi
        done

        set -eo pipefail

        echo ""
        echo "=== Summary: $extracted packages extracted ==="
        if [ "$extracted" -eq 0 ]; then
          echo "ERROR: nothing extracted — Termux index or downloads broken"
          exit 1
        fi

        echo ""
        echo "=== Verify sysroot ==="
        find "$SYSROOT" -name "glib.h" 2>/dev/null | head -3 || true
        find "$SYSROOT" -name "pixman.h" 2>/dev/null | head -3 || true
        find "$SYSROOT" -name "libslirp*" 2>/dev/null | head -3 || true

    # ================================================================
    # Step 7: Build QEMU → libp2dengine.so
    # ================================================================
    - name: Build QEMU native engine
      id: qemu
      run: |
        set -euo pipefail
        NDK="${{ env.NDK_HOME }}"
        SYSROOT="${{ env.SYSROOT }}"
        TOOLBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export PATH="$TOOLBIN:$PATH"

        echo "llvm-ar:      $(command -v llvm-ar || echo NOT FOUND)"
        echo "llvm-strip:   $(command -v llvm-strip || echo NOT FOUND)"

        CC="$TOOLBIN/aarch64-linux-android24-clang"
        CXX="$TOOLBIN/aarch64-linux-android24-clang++"
        AR="$TOOLBIN/llvm-ar"
        STRIP="$TOOLBIN/llvm-strip"
        OBJCOPY="$TOOLBIN/llvm-objcopy"

        cd "${GITHUB_WORKSPACE}/qemu-android-exact"

        PREFIX="$SYSROOT/data/data/com.termux/files/usr"
        if [ ! -d "$PREFIX" ]; then
          echo "ERROR: Termux sysroot not at $PREFIX"
          echo "ls of $SYSROOT:"; ls "$SYSROOT"
          exit 1
        fi
        echo "Using prefix: $PREFIX"
        ls "$PREFIX/include/glib-2.0/glib.h"
        ls "$PREFIX/include/pixman-1/pixman.h"
        ls "$PREFIX/lib/pkgconfig/glib-2.0.pc"

        # pkg-config setup: Termux .pc files have prefix=/data/data/com.termux/files/usr
        # which is the Android runtime path. PKG_CONFIG_SYSROOT_DIR remaps that
        # absolute prefix back into our extracted sysroot on the CI filesystem.
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"
        export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

        # Verify pkg-config can resolve glib-2.0
        echo "=== pkg-config test ==="
        PKGCONFIG=/usr/bin/pkg-config
        $PKGCONFIG --libs glib-2.0 2>&1 || echo "WARN: pkg-config glib-2.0 failed"
        $PKGCONFIG --cflags glib-2.0 2>&1 || echo "WARN: pkg-config glib-2.0 failed"

        rm -rf build-android

        # Use --cross-prefix=llvm- so meson enters cross-build mode (build type
        # must be "cross build", NOT "native build" — otherwise aarch64 sanity
        # check binaries won't run on x86_64 CI). Set PKG_CONFIG explicitly so
        # configure does NOT prefix it with "llvm-" (NDK doesn't ship that).
        # Other binutils (ar, strip, objcopy, ld, ...) use the same pattern
        # VAR="${VAR-${cross_prefix}var}" so our env-var overrides win.
        PKG_CONFIG=/usr/bin/pkg-config AR="$AR" STRIP="$STRIP" OBJCOPY="$OBJCOPY" \
        ./configure \
          --target-list=arm-softmmu \
          --with-devices-arm=p2d \
          --cc="$CC" --cxx="$CXX" \
          --host-cc=gcc --cross-prefix="llvm-" \
          --cpu=aarch64 \
          --disable-werror \
          --without-default-features \
          --without-default-devices \
          --enable-tcg \
          --enable-pixman \
          --enable-slirp \
          --disable-tools \
          --disable-docs \
          --disable-user \
          --disable-plugins \
          --disable-modules \
          --extra-cflags="-I${PREFIX}/include -I${PREFIX}/include/pixman-1 -I${PREFIX}/include/glib-2.0 -I${PREFIX}/lib/glib-2.0/include" \
          --extra-ldflags="-L${PREFIX}/lib -Wl,-z,max-page-size=16384 -Wl,-rpath,\$ORIGIN" \
          --prefix="/data/local/tmp" \
          2>&1 | tee "${GITHUB_WORKSPACE}/android/build/configure.log"

        echo "=== configure OK, starting ninja ==="
        cd build
        ninja -j$(nproc) qemu-system-arm 2>&1 | tee "${GITHUB_WORKSPACE}/android/build/ninja.log"

        mkdir -p "${GITHUB_WORKSPACE}/android/build"
        cp qemu-system-arm "${GITHUB_WORKSPACE}/android/build/libp2dengine.so"
        file "${GITHUB_WORKSPACE}/android/build/libp2dengine.so"

        echo "=== Building libp2dstorage.so ==="
        "$CC" -shared -fPIC -O2 \
          -I"$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include" \
          "${GITHUB_WORKSPACE}/android/native/storage_publish.c" \
          -o "${GITHUB_WORKSPACE}/android/build/libp2dstorage.so"
        file "${GITHUB_WORKSPACE}/android/build/libp2dstorage.so"
        echo "✓ QEMU engine built"

    # ================================================================
    # Step 8: Build APK (Java + DEX + align + debug-sign)
    # ================================================================
    - name: Build APK
      run: python3 android/build_apk_gha.py

    # ================================================================
    # Step 9: Upload artifact
    # ================================================================
    - uses: actions/upload-artifact@v4
      with:
        name: Pocket2Droid-debug-${{ github.sha }}
        path: android/build/Pocket2Droid-DEBUG.apk
        if-no-files-found: error
        retention-days: 30
